name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: C, C++, shell, Python and Julia checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install networkx
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - run: LEAN=0 scripts/run_all.sh
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build/*.txt

  lean:
    name: Lean 4 library (encoder, reduction, drawings, colourings, axiom audit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit
        working-directory: verification/lean
        run: |
          lake build 2>&1 | tee ../../lean-build.txt
          lake env lean Check.lean 2>&1 | tee ../../lean-check.txt
          ! grep -q "declaration uses 'sorry'\|error" ../../lean-build.txt ../../lean-check.txt
          grep -q "axiom audit: .* theorems, all within propext, Classical.choice, Quot.sound" ../../lean-check.txt
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-logs
          path: lean-*.txt

  paper:
    name: Build the paper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended lmodern poppler-utils zip
      - run: scripts/build_paper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            dist/*.pdf
            dist/*.zip
            dist/*.tar.gz
